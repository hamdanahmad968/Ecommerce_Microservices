services:

  postgres:
    container_name: postgres_container
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce_microservices
      POSTGRES_USER: hamdanx
      POSTGRES_PASSWORD: hamdanx
#      TZ: Asia/Kolkata
#      PGTZ: Asia/Kolkata
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    networks:
      - backend-network
    restart: unless-stopped


  user-service:
    build: ./user
    container_name: user_container
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - backend-network
    restart: unless-stopped


  product-service:
    build: ./product
    container_name: product_container
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - backend-network
    restart: unless-stopped


  order-service:
    build: ./order
    container_name: order_container
    ports:
      - "8083:8080"
    depends_on:
      - postgres
    networks:
      - backend-network
    restart: unless-stopped


volumes:
  postgres_data:

networks:
  backend-network:
